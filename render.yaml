databases:
  - name: practicekz-db
    plan: free
    databaseName: practicekz
    user: practice

services:
  - type: web
    name: practicekz
    runtime: node
    plan: free
    buildCommand: >-
      cd web && npm install --include=dev && npm run build &&
      cd ../server && npm install --include=dev && npx prisma generate
    startCommand: >-
      cd server && npx prisma db push --skip-generate && (npm run db:indexes || true) && npx tsx scripts/seed-if-empty.ts && npx tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: practicekz-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
