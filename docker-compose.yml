services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: practicekz
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practicekz"]
      interval: 3s
      retries: 20
  api:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://practice:practice@db:5432/practicekz
      TEST_DATABASE_URL: postgresql://practice:practice@db:5432/practicekz_test
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
  web:
    build: ./web
    depends_on: [api]
    environment:
      API_TARGET: http://api:4000
    ports: ["5173:5173"]
volumes:
  pgdata:
  uploads:
